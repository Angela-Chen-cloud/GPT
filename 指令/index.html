<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatGPT 快速指令庫</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#15171a;--muted:#687078;--accent:#16a37d;--line:#e3e6e8;--shadow:0 8px 24px rgba(0,0,0,.06)}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:rgba(246,247,249,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:auto;padding:22px}.hero{display:flex;gap:18px;align-items:end;justify-content:space-between;flex-wrap:wrap}.hero h1{margin:0;font-size:30px}.hero p{margin:6px 0 0;color:var(--muted)}
.search{flex:1;min-width:280px;max-width:520px;position:relative}.search input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;font-size:16px;outline:none;background:#fff}.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,163,125,.12)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.filters button{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:999px;cursor:pointer}.filters button.active{background:var(--text);color:#fff;border-color:var(--text)}
main{max-width:1180px;margin:auto;padding:24px 22px 50px}.meta{color:var(--muted);margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}.top{display:flex;justify-content:space-between;gap:10px;align-items:start}.cmd{font-size:19px;font-weight:800}.num{color:var(--muted);font-size:13px}.desc{line-height:1.55}.tag{display:inline-block;font-size:12px;background:#eaf8f4;color:#08785b;border-radius:999px;padding:5px 9px}.copy{align-self:flex-end;border:0;background:#f0f2f4;padding:7px 10px;border-radius:9px;cursor:pointer}.copy:hover{background:#e5e8eb}.empty{display:none;text-align:center;padding:70px;color:var(--muted)}
footer{text-align:center;color:var(--muted);padding:30px} @media(max-width:600px){.hero h1{font-size:25px}.wrap{padding:16px}main{padding:18px 16px}.grid{grid-template-columns:1fr}}
</style>
</head><body>

<main><div class="meta" id="meta"></div><div class="grid" id="grid"></div><div class="empty" id="empty">找不到符合的指令 🔎</div></main>

const cats=['全部',...new Set(data.map(x=>x[0]))]; let active='全部';
const filters=document.getElementById('filters'), grid=document.getElementById('grid'), q=document.getElementById('q'), meta=document.getElementById('meta'), empty=document.getElementById('empty');
function drawFilters(){filters.innerHTML='';cats.forEach(c=>{let b=document.createElement('button');b.textContent=c;b.className=c===active?'active':'';b.onclick=()=>{active=c;drawFilters();render()};filters.appendChild(b)})}
function render(){const s=q.value.trim().toLowerCase();const rows=data.filter(x=>(active==='全部'||x[0]===active)&&(!s||x.join(' ').toLowerCase().includes(s)));grid.innerHTML='';rows.forEach((x,i)=>{let el=document.createElement('article');el.className='card';el.innerHTML=`<div class="top"><div><span class="tag">${x[0]}</span><div class="cmd">${x[1]}</div></div><span class="num">#${data.indexOf(x)+1}</span></div><div class="desc">${x[2]}</div><button class="copy">複製指令</button>`;el.querySelector('.copy').onclick=async(e)=>{await navigator.clipboard.writeText(x[1]);e.target.textContent='已複製 ✓';setTimeout(()=>e.target.textContent='複製指令',900)};grid.appendChild(el)});meta.textContent=`顯示 ${rows.length} / ${data.length} 個指令`;empty.style.display=rows.length?'none':'block'}
